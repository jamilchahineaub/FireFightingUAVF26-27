# ros_gz_bridge for the cl415 (ROS 2 Jazzy <-> Gazebo Harmonic)
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /cl415/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /cl415/odometry
  gz_topic_name: /cl415/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /cl415/imu
  gz_topic_name: /cl415/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# control surfaces: angle in rad (ailerons/elevator + = trailing edge down, rudder + = trailing edge left)
- ros_topic_name: /cl415/cmd/left_aileron
  gz_topic_name: /cl415/cmd/left_aileron
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /cl415/cmd/right_aileron
  gz_topic_name: /cl415/cmd/right_aileron
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /cl415/cmd/elevator
  gz_topic_name: /cl415/cmd/elevator
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /cl415/cmd/rudder
  gz_topic_name: /cl415/cmd/rudder
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

# motors: velocity[0] = left, velocity[1] = right, rad/s (max 890)
- ros_topic_name: /cl415/command/motor_speed
  gz_topic_name: /cl415/command/motor_speed
  ros_type_name: actuator_msgs/msg/Actuators
  gz_type_name: gz.msgs.Actuators
  direction: ROS_TO_GZ
